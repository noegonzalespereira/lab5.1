name: CD - Build, Push and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nestjs-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/nestjs-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en servidor remoto
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/nestjs-app:latest"
            
            # 1. Bajar la imagen nuevas
            docker pull $IMAGE
            
            # 2. Correrla en el puerto 3001 para validar
            docker run -d --name nest-app-new -p 3001:3001 $IMAGE
            
            # 3. Esperar a que NestJS eche a andar
            sleep 20
            
            # 4. Health check (validamos contra Swagger /api)
            if curl -sf http://localhost:3001/api; then
              echo "Health check exitoso. Activando versión nueva..."
              docker stop nest-app || true
              docker rm nest-app || true
              
              # 5. Desplegar en el puerto 80 (el que abrimos en AWS)
              docker run -d --name nest-app --restart unless-stopped -p 80:3001 $IMAGE
              docker rm -f nest-app-new || true
            else
              echo "Health check FALLIDO. Manteniendo versión anterior."
              docker rm -f nest-app-new || true
              exit 1
            fi
            
            # 6. Limpieza de imágenes viejas
            docker system prune -f